<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Restbook — Rencana Masakan Sosial</title>

<!-- PWA: manifest + ikon -->
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=restbook1" />
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png?v=restbook1" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=restbook1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Restbook" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

<!-- Open Graph / WhatsApp / Facebook -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Restbook" />

<meta property="og:image:height" content="512" />

<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Restbook - Rencana Masak & Berbagi Resep" />
<meta name="twitter:description" content="Bingung mau masak apa hari ini? Lihat inspirasi menu, bagikan resep, dan ngobrol bareng pecinta masak." />
<meta name="twitter:image" content="https://Restbook.vercel.app/icons/icon-512.png" />

<!-- Supabase JS SDK (CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root{
    /* Tema clean soft ala Apple */
    --bg:#f2f2f7;          /* dasar abu-abu muda */
    --surface:#ffffff;     /* kartu putih */
    --surface-2:#fafafa;
    --peach:#f4e6d6;
    --peach-soft:#faf1e6;
    --coral:#b5652c;       /* aksen coklat Restbook */
    --coral-dark:#8c4a1f;
    --cream:#fffaf0;
    --ink:#1c1c1e;
    --ink-2:#3a3a3c;
    --muted:#8e8e93;
    --line:rgba(60,60,67,.12);
    --white:#fff;
    --green:#34c759; --red:#ff3b30;
    --radius:14px;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* overflow-x:clip mencegah geser horizontal TANPA mematikan position:sticky
     (jangan pakai overflow-x:hidden, itu merusak header sticky).
     background di html mewarnai area overscroll/tarik-ke-bawah agar senada. */
  html{
    background-color:var(--bg);
    overscroll-behavior-y:none;
  }
  html,body{margin:0;padding:0;overflow-x:clip;max-width:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Nunito',sans-serif;
    background-color:var(--bg);
    color:var(--ink); min-height:100vh; font-size:14px; line-height:1.4;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:14px}
  a{color:var(--coral-dark);text-decoration:none;word-break:break-word}
  .hidden{display:none !important}

  /* ---------- App shell (mobile-first, centered) ---------- */
  #app{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:72px;position:relative}
  img{max-width:100%}

  /* ---------- Auth screen ---------- */
  #authScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
  .auth-card{background:var(--white);border-radius:28px;padding:32px 26px;width:100%;box-shadow:var(--shadow);text-align:center}
  .logo-mark{font-size:54px}
  .auth-card h1{margin:8px 0 4px;font-size:28px;color:var(--coral-dark);font-weight:500;letter-spacing:.5px}
  .auth-card p.sub{margin:0 0 24px;color:var(--muted);font-size:14px}
  .field{margin-bottom:14px;text-align:left}
  .field label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
  .field input,.field textarea,.field select{
    width:100%;padding:13px 15px;border:2px solid var(--peach-soft);border-radius:14px;
    background:var(--cream);outline:none;transition:border .2s;color:var(--ink)}
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--coral)}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:14px;border-radius:14px;font-weight:500;font-size:15px;
    background:var(--coral);color:#fff;transition:transform .1s,background .2s}
  .btn:active{transform:scale(.97)}
  .btn.secondary{background:var(--peach-soft);color:var(--coral-dark)}
  .btn.ghost{background:transparent;color:var(--coral-dark);border:2px solid var(--peach-soft)}
  .btn:disabled{opacity:.55}
  .auth-switch{margin-top:18px;font-size:14px;color:var(--muted)}
  .auth-switch a{font-weight:500}
  .err-msg{color:var(--red);font-size:13px;margin:-6px 0 12px;min-height:18px;font-weight:500}
  .demo-hint{margin-top:18px;font-size:12px;color:var(--muted);background:var(--cream);padding:10px 12px;border-radius:10px}

  /* ---------- Top bar: frosted glass putih ala iOS ---------- */
  .topbar{
    position:sticky;top:0;z-index:30;padding:0;display:flex;flex-direction:column;
    background:rgba(249,249,249,.86);
    -webkit-backdrop-filter:saturate(180%) blur(18px);
    backdrop-filter:saturate(180%) blur(18px);
    border-bottom:1px solid var(--line);
    transform:translateZ(0);
  }
  .topbar::before{
    content:'';display:block;height:env(safe-area-inset-top,0px);flex-shrink:0;
  }
  .topbar-row{
    display:flex;align-items:center;gap:6px;padding:10px 12px 8px;
  }

  /* Sembunyikan topbar global saat di chat, agar chat-head jadi header tunggal (tidak saling menimpa) */
  .topbar.hide{display:none}
  /* ===== PWA standalone: samakan warna sampai ke status bar =====
     Hanya aktif saat di-install, tampilan browser biasa TIDAK berubah. */
  @media (display-mode: standalone), (display-mode: fullscreen) {
    body{
      background-color:#ffe8c9;
      background-image:linear-gradient(180deg,#ffe8c9 0%,#ffe8c9 120px,#fff6e6 260px,#fdf4e4 100%);
    }
    .bottom-nav{
      padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 6px);
    }
    .chat-input{
      padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 8px);
    }
  }
  .topbar .title{font-size:18px;font-weight:500;color:var(--coral-dark);flex:1;
    background:none;border:none;cursor:pointer;text-align:left;padding:0;display:flex;align-items:center}
  .brand-logo{height:30px;width:auto;display:block}
  /* login logo */
  .logo-mark{margin-bottom:8px}
  .login-logo{width:230px;max-width:80%;height:auto;display:block;margin:0 auto}
  .icon-btn{
    width:38px;height:38px;border-radius:50%;background:transparent;display:flex;
    align-items:center;justify-content:center;color:var(--ink-2);position:relative;flex-shrink:0;
    transition:background .15s}
  .icon-btn:active{background:rgba(0,0,0,.06)}
  .icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .badge-dot{position:absolute;top:6px;right:6px;width:9px;height:9px;background:var(--red);border-radius:50%;border:2px solid var(--surface)}

  /* ---------- Views / pages ---------- */
  .page{padding:2px 10px 8px;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .section-title{font-weight:700;font-size:11.5px;margin:10px 4px 6px;display:flex;align-items:center;gap:6px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .chip{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:600;background:var(--peach-soft);color:var(--coral-dark)}
  .chip.green{background:#dff0db;color:#4d8a47}

  /* ---------- Feed card ---------- */
  .card{background:var(--surface);border-radius:12px;padding:11px;box-shadow:var(--shadow);margin:6px 0;border:1px solid var(--line);overflow:hidden}
  .post-head{display:flex;align-items:center;gap:9px;margin-bottom:7px;min-width:0}
  .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--coral-dark));
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex-shrink:0;
    object-fit:cover}
  .post-head .meta{flex:1;min-width:0;padding-top:1px}
  .post-head .name{font-weight:600;font-size:13.5px;line-height:1.25;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .post-head .username-line{font-size:11px;color:var(--muted);font-weight:400;margin-top:1px}
  .post-head .when{font-size:11px;color:var(--muted)}
  .day-ribbon{background:var(--peach-soft);color:var(--coral-dark);
    font-weight:600;font-size:9.5px;padding:3px 8px;border-radius:8px;white-space:nowrap;
    flex-shrink:0;margin-left:6px;margin-top:2px;text-align:right;line-height:1.2}
  .meal-tag{font-size:10px;font-weight:600;color:#fff;background:var(--coral);padding:2px 7px;border-radius:999px;text-transform:capitalize}
  .post-title{font-size:15px;font-weight:600;margin:1px 0 3px;word-break:break-word;line-height:1.28;color:var(--ink)}
  .post-desc{color:var(--ink-2);font-size:13px;margin:0 0 6px;word-break:break-word}
  .post-actions{display:flex;gap:2px;border-top:1px solid var(--line);padding-top:6px;margin-top:6px}
  .act{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:6px 2px;border-radius:8px;
    color:var(--muted);font-weight:500;font-size:12.5px;transition:background .15s;min-width:0}
  .act:active{background:var(--bg)}
  .act.liked{color:var(--red)}
  .act.liked svg{stroke:var(--red);fill:rgba(255,59,48,.12)}
  .act .ic{display:flex;align-items:center}
  .act .ic svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- Comments ---------- */
  .comments{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;min-width:0}
  .comment{display:flex;gap:8px;margin-bottom:9px;min-width:0}
  .comment .avatar{width:28px;height:28px;font-size:11px}
  .comment .bubble{background:var(--bg);border-radius:12px;padding:7px 10px;flex:1;min-width:0}
  .comment .c-name{font-weight:600;font-size:12px;color:var(--ink)}
  .comment .c-text{font-size:13px;color:var(--ink-2);word-break:break-word;margin-top:1px}
  .comment .c-when{font-size:10.5px;color:var(--muted)}
  .comment-input{display:flex;gap:6px;margin-top:8px}
  .comment-input input{flex:1;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);outline:none;min-width:0;color:var(--ink)}
  .comment-input input:focus{border-color:var(--coral)}
  .comment-input button{width:38px;height:38px;border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .comment-input button svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- Profile ---------- */
  .profile-hero{background:linear-gradient(135deg,#fff3e6,#fff8ef);border-bottom:1px solid var(--line);padding:22px 16px 18px;text-align:center;margin:-4px -11px 12px}
  .profile-hero .avatar{width:72px;height:72px;font-size:26px;margin:0 auto 8px;box-shadow:var(--shadow)}
  .profile-hero h2{margin:0;font-size:19px;font-weight:500}
  .profile-hero .uname{color:var(--muted);font-weight:400;font-size:12px}
  .profile-hero .bio{margin:6px auto 3px;max-width:320px;font-size:13px;color:#6b5454;word-break:break-word}
  .pill-row{display:flex;justify-content:center;gap:6px;margin-top:8px;flex-wrap:wrap}
  .stat-pill{background:#fff;padding:5px 11px;border-radius:999px;font-size:11px;font-weight:500;box-shadow:var(--shadow);word-break:break-word}

  /* ---------- Meal planner ---------- */
  .day-tabs{display:flex;gap:5px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
  .day-tabs::-webkit-scrollbar{display:none}
  .day-tab{flex-shrink:0;padding:6px 12px;border-radius:9px;background:transparent;font-weight:600;font-size:12.5px;
    color:var(--muted);text-transform:capitalize;white-space:nowrap;transition:background .15s}
  .day-tab:active{background:var(--bg)}
  .day-tab.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
  .day-tab .mini{display:block;font-size:9px;font-weight:500;opacity:.8}
  .meal-block{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px}
  .meal-block h4{margin:4px 0 8px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:700}
  .meal-row{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line);margin-bottom:2px;min-width:0}
  .meal-row:last-child{border-bottom:none}
  .meal-row .emoji{font-size:20px;flex-shrink:0}
  .meal-row .info{flex:1;min-width:0}
  .meal-row .t{font-weight:500;font-size:13px;word-break:break-word}
  .meal-row .d{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meal-row .edit{color:var(--coral-dark);font-weight:500;font-size:12px;flex-shrink:0;padding:2px 4px}
  .add-meal{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:10px;margin-top:6px;
    border:1px dashed var(--line);border-radius:10px;color:var(--coral-dark);font-weight:600;background:transparent;font-size:13px}

  /* ---------- DM ---------- */
  /* Chat: full-bleed, nempel ke atas & penuh kiri-kanan (mirip WA) */
  .chat-view{padding:0 !important;display:flex;flex-direction:column;min-height:100vh;animation:none;background:#f6ece0}
  /* area di atas chat-head (saat topbar disembunyikan) ikut warna chat-head */
  body.topbar-hidden{background:#f6ece0}
  body.topbar-hidden #app{background:#fff1dd}
  /* Header chat: efek frosted glass transparan saat konten lewat di belakang */
  .chat-head{
    position:sticky;top:0;z-index:30;
    background:rgba(249,249,249,.86);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    backdrop-filter:saturate(180%) blur(14px);
    display:flex;align-items:center;gap:9px;flex-shrink:0;
    padding:calc(env(safe-area-inset-top,0px) + 9px) 12px 9px;
    margin:0;border-bottom:1px solid var(--line);
    width:100%;box-sizing:border-box;
    transform:translateZ(0); /* paksa layer GPU agar scroll mulus */
  }
  .convo-item{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line);background:transparent;border-radius:0;margin-bottom:0;position:relative;width:100%;text-align:left;min-width:0}
  .convo-item .avatar{width:42px;height:42px;font-size:15px}
  .convo-item .info{flex:1;min-width:0}
  .convo-item .nm{font-weight:500;font-size:14px}
  .convo-item .pv{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .convo-item .tm{font-size:10.5px;color:var(--muted);flex-shrink:0}
  .unread-dot{width:9px;height:9px;background:var(--coral);border-radius:50%;position:absolute;right:12px;top:12px}
  /* Notifikasi */
  .notif-item .nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .notif-meal-tag{display:inline-block;font-size:10.5px;font-weight:500;color:var(--coral-dark);
    background:var(--peach-soft);padding:2px 8px;border-radius:999px;max-width:100%;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .notif-actions{margin-top:5px;display:flex;gap:6px}
  .notif-reply{font-size:11px;font-weight:500;color:var(--coral-dark);background:var(--peach-soft);
    padding:4px 10px;border-radius:999px;border:none;cursor:pointer}
  .notif-reply:active{background:var(--peach)}
  .notif-item.read{opacity:.7}

  .chat-head .avatar{width:36px;height:36px;font-size:13px}
  .chat-head .nm{font-weight:500;font-size:14px}
  .back-btn{font-size:22px;padding:2px 6px;line-height:1}
  .chat-messages{padding:12px 12px 90px;display:flex;flex-direction:column;gap:8px;flex:1 1 auto;background:#f6ece0;min-height:0}
  .bubble-msg{max-width:78%;padding:9px 13px;border-radius:18px;font-size:14px;word-break:break-word;overflow-wrap:anywhere;line-height:1.35}
  .bubble-msg .ct{font-size:10px;opacity:.7;margin-top:3px;text-align:right}
  .bubble-msg.them{background:#fffaf4;border:1px solid #ecd9c4;align-self:flex-start;border-bottom-left-radius:14px}
  .bubble-msg.me{background:linear-gradient(135deg,#c07740,#a85a26);color:#fff;align-self:flex-end;border-bottom-right-radius:16px}
  /* RESEP: jangan sampai keluar dari form */
  .recipe-card{background:#fff8ed;border:1px solid #ffd9bd;border-radius:11px;padding:9px;margin-top:6px;font-size:12.5px;
    word-break:break-word;overflow-wrap:anywhere;white-space:pre-wrap;max-width:100%;overflow-x:hidden}
  .recipe-card b{color:var(--coral-dark)}
  .chat-input{position:fixed;bottom:0;max-width:480px;width:100%;left:50%;transform:translateX(-50%);display:flex;gap:7px;
    padding:10px 11px;
    padding-bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
    background:rgba(246,236,224,.96);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:1px solid #e6d2bc}
  .chat-input input{flex:1;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);outline:none;min-width:0}
  .chat-input button{width:42px;height:42px;border-radius:50%;background:var(--coral);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .share-recipe-btn{font-size:12px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2);font-weight:600;flex-shrink:0}

  /* ---------- Modal ---------- */
  .modal-bg{position:fixed;inset:0;background:rgba(61,43,43,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
  .modal{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 15px 22px;max-height:92vh;overflow-y:auto;animation:slideup .28s ease}
  @keyframes slideup{from{transform:translateY(100%)}to{transform:none}}
  .modal h3{margin:0 0 12px;font-size:17px;color:var(--coral-dark)}
  .modal .close-x{position:absolute;top:11px;right:14px;font-size:22px;color:var(--muted)}
  .modal-wrap{position:relative;max-width:100%}
  .emoji-pick{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px}
  .emoji-pick button{font-size:20px;width:40px;height:40px;border-radius:11px;background:var(--cream)}
  .emoji-pick button.sel{background:var(--peach-soft);outline:2px solid var(--coral)}
  /* resep di dalam modal */
  .modal .recipe-card, .modal [style*="pre-wrap"]{font-size:12.5px;line-height:1.5}
  .field{margin-bottom:12px}
  .field input,.field textarea,.field select{padding:11px 13px;border-radius:12px;border-width:2px}
  .btn{padding:12px;border-radius:13px;font-size:14px}

  /* ---------- Bottom nav ---------- */
  .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:480px;width:100%;
    background:rgba(249,249,249,.9);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);
    display:flex;justify-content:space-around;padding:4px 4px 6px;border-top:1px solid var(--line);z-index:30;
    transition:transform .25s ease}
  .bottom-nav.hide{transform:translate(-50%,120%)}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:9.5px;font-weight:500;padding:2px;border-radius:10px;transition:color .15s}
  .nav-item .ni{display:flex;align-items:center;justify-content:center}
  .nav-item .ni svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .nav-item.active{color:var(--coral-dark)}
  .nav-item.active .ni svg{stroke-width:2.2}

  .empty{text-align:center;padding:32px 16px;color:var(--muted)}
  .empty .eicon{font-size:42px;margin-bottom:6px}

<script>

const SUPABASE_ANON_KEY = 'sb_publishable_rbFdwpRZMEULUV58Rm-nAw_HfLTn_1P';

const DAY_ID = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'];
const DAY_IDN = {monday:'Senin',tuesday:'Selasa',wednesday:'Rabu',thursday:'Kamis',friday:'Jumat',saturday:'Sabtu',sunday:'Minggu'};

let state = {

/* ----------------- Utilities ----------------- */

/* Ikon outline gaya Instagram/Apple (24x24) */
const ICONS = {
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="M9 21v-6h6v6"/>',

function icon(name,size=22){
  const p=ICONS[name]||'';
  return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
}

/* ---------- Media helpers (foto / video link) ---------- */
// Deteksi YouTube dari URL & ambil ID
function youtubeId(url){
  if(!url) return null;
  const m=url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/);
  return m?m[1]:null;
}
function mediaType(url){
  if(!url) return null;
  const u=url.trim();
  if(youtubeId(u)) return 'youtube';
  if(/\.(mp4|webm|mov)(\?|$)/i.test(u)) return 'video_link';
  if(/^https?:\/\/.+\.(jpe?g|png|webp|gif|avif)(\?|$)/i.test(u)) return 'photo';
  return null;
}
function ytThumb(id){ return `https://i.ytimg.com/vi/${id}/hqdefault.jpg`; }
function ytEmbed(id){ return `https://www.youtube.com/embed/${id}?rel=0`; }

// Blok media di kartu: foto (klik untuk perbesar) atau video YouTube (klik play)
function mediaBlock(mp){
  const url=mp.media_url, type=mp.media_type||mediaType(url);
  if(type==='youtube'){
    const id=youtubeId(url);
    const wrap=el('div',{className:'media video',onClick(){ playYt(id,wrap); }});
    wrap.innerHTML=
      `<img loading="lazy" src="${ytThumb(id)}" alt="" class="media-img"/>
       <span class="play-badge" aria-hidden="true">${icon('play',28)}</span>`;
    return wrap;
  }
  if(type==='photo'){
    return el('div',{className:'media',onClick(){ openLightbox(url); }},
      el('img',{className:'media-img',src:url,loading:'lazy',alt:mp.title||''}));
  }
  if(type==='video_link'){
    const v=el('video',{className:'media-img',src:url,controls:false,preload:'none',playsInline:true});
    return el('div',{className:'media'},v);
  }
  // link tak dikenal -> tampilkan sebagai tautan
  return el('a',{className:'media-link',href:url,target:'_blank',rel:'noopener'},'Lihat lampiran');
}
function playYt(id,wrap){
  const f=document.createElement('iframe');
  f.className='media-iframe';
  f.src=ytEmbed(id)+'&autoplay=1';
  f.title='YouTube'; f.setAttribute('allow','autoplay; encrypted-media; picture-in-picture; fullscreen');
  f.setAttribute('allowfullscreen','true');
  // ganti isi wrap, pertahankan ukuran 16:9
  wrap.onclick=null; wrap.innerHTML=''; wrap.classList.add('playing'); wrap.append(f);
}
function openLightbox(src){
  const bg=el('div',{className:'lightbox',onClick:e=>{if(e.target===bg)bg.remove();}});
  bg.innerHTML=`<img src="${src}" alt=""/>`;
  const close=el('button',{className:'lightbox-close',onClick:()=>bg.remove(),innerHTML:icon('close',22)});
  bg.append(close); document.body.append(bg);
}
const el = (t,a,...c) => {
  const e=document.createElement(t);
  if(a) for(const[k,v] of Object.entries(a)){
    if(v==null||v===false) continue;
    // Event handler: onClick/onchange/onKeydown dll -> addEventListener (lowercase)
    if(k.startsWith('on') && typeof v==='function'){
      e.addEventListener(k.slice(2).toLowerCase(), v);
    }
    // Style bisa string ("color:red") atau object ({color:'red'})
    else if(k==='style' && v && typeof v==='object'){ Object.assign(e.style, v); }
    else if(k==='className'){ e.className = v; }
    else if(k==='htmlFor'){ e.htmlFor = v; }
    else if(k in e && typeof e[k]!=='object'){
      // Properti bawaan: value, src, href, type, placeholder, dll.
      try{ e[k]=v; }catch(_){ e.setAttribute(k, v); }
    } else {
      e.setAttribute(k, v);
    }
  }
  c.flat().forEach(ch=>{
    if(ch==null||ch===false) return;
    e.append(ch.nodeType?ch:document.createTextNode(ch));
  });
  return e;
};
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function timeAgo(iso){
  const d=new Date(iso), diff=(Date.now()-d.getTime())/1000;
  if(diff<60)return 'baru saja'; if(diff<3600)return Math.floor(diff/60)+' mnt';
  if(diff<86400)return Math.floor(diff/3600)+' jam'; return d.toLocaleDateString('id-ID',{day:'numeric',month:'short'});
}
function todayName(){ return DAY_ID[new Date().getDay()===0?6:new Date().getDay()-1]; }
function avatarFor(p){
  if(p.avatar_url){ const img=document.createElement('img'); img.className='avatar'; img.src=p.avatar_url; return img; }
  return el('div',{className:'avatar'}, initials(p.full_name||p.username));
}
async function getProfile(uid){
  if(state.profilesCache[uid]) return state.profilesCache[uid];

async function handleAuth(){
  const isLogin = state.authMode!=='register';
  const errEl=document.getElementById('authErr');
  const btn=document.getElementById('submitAuth');
  const passEl=document.getElementById('authPass');
  const idEl=document.getElementById('authId');
  if(errEl) errEl.textContent='';
  if(!idEl||!passEl){ return; }
  const pass=passEl.value;
  const identifier=idEl.value.trim();
  if(!identifier){ if(errEl) errEl.textContent='Masukkan email atau username.'; return; }
  if(!pass){ if(errEl) errEl.textContent='Kata sandi wajib diisi.'; return; }
  btn.disabled=true; const oldText=btn.textContent; btn.textContent='Tunggu...';
  try{
    if(isLogin){
      let email=identifier;
      // Jika bukan format email, anggap username -> cari email di profiles
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(identifier)){
        const {data:prof}=await sb.from('profiles').select('email').eq('username',identifier).maybeSingle();
        if(prof && prof.email){ email=prof.email; }
        else { throw new Error('Username tidak ditemukan. Coba login pakai email.'); }
      }
      const {error}=await sb.auth.signInWithPassword({email,password:pass});
      if(error) throw error;
    }else{
      // Daftar
      const email=identifier;
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) throw new Error('Masukkan email yang valid untuk daftar.');
      const username=(document.getElementById('regUser')?.value||'').trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
      const full_name=(document.getElementById('regName')?.value||'').trim()||username;
      if(!username) throw new Error('Username wajib diisi.');
      const {data:used}=await sb.from('profiles').select('username').eq('username',username).maybeSingle();
      if(used) throw new Error('Username sudah dipakai, pilih yang lain.');
      const {error}=await sb.auth.signUp({email,password:pass,options:{data:{username,full_name,email}}});
      if(error) throw error;
      toast('Pendaftaran berhasil! Cek email bila perlu verifikasi.');
    }
    await loadSession();
  }catch(e){
    if(errEl) errEl.textContent=e.message||'Terjadi kesalahan.';
  }finally{
    btn.disabled=false; btn.textContent=oldText;
  }
}

async function loadSession(){
  const {data}=await sb.auth.getSession();
  state.user=data.session?.user||null;
  if(state.user){
    const {data:p}=await sb.from('profiles').select('*').eq('id',state.user.id).single();
    state.profile=p;
    if(!p){ // fallback bila trigger belum jalan
      await sb.from('profiles').insert({id:state.user.id,username:state.user.user_metadata?.username||state.user.email.split('@')[0],full_name:state.user.user_metadata?.full_name||'',email:state.user.email}).eq('id',state.user.id);
      const {data:p2}=await sb.from('profiles').select('*').eq('id',state.user.id).single(); state.profile=p2;
    }
    await loadFollows();
    renderShell();
    subscribeRealtime();
    refreshUnreadCounts();
  }else{
    state.authMode='login'; renderAuth();
  }
}

function setActiveNav(){ document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active')); const b=document.querySelector(`.nav-item`); }
function go(view,opts={}){
  state.view=view; if(opts.chatWith)state.chatWith=opts.chatWith;
  const host=$('#pageHost'); if(!host)return;
  // hapus chat-input mengambang bila keluar dari chat
  document.querySelectorAll('.chat-input').forEach(i=>i.remove());
  host.innerHTML='';
  const activeView = (view==='messages' && state.chatWith) ? null : view;
  const navViews=['feed','explore','planner','messages','profile'];
  document.querySelectorAll('.nav-item').forEach((n,i)=>{
    n.classList.toggle('active', navViews[i]===activeView);
  });
  if(view==='feed') renderFeed(host);
  else if(view==='explore') renderExplore(host);
  else if(view==='planner') renderPlanner(host);
  else if(view==='messages') state.chatWith?renderChat(host):renderConversations(host);
  else if(view==='notifications') renderNotifications(host);
  else if(view==='profile') renderProfile(host);

function avaCircle(u,size){
  const name=(u&&(u.full_name||u.username)||'?').trim();

  // Hanya render <img> kalau ada URL; kalau gagal load, sembunyikan & tampil inisial
  const img=src?`<img src="${src}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"/>`:'';
  const initStyle=src?'':'display:flex';
  return `<div class="ava" style="width:${size}px;height:${size}px;font-size:${Math.round(size*0.4)}px">${img}<span class="ava-init" style="${initStyle}">${initial}</span></div>`;
}
function renderStoriesBar(){

async function addStory(){
  const input=document.createElement('input');
  input.type='file'; input.accept='image/*'; input.multiple=true;
  input.onchange=async()=>{
    const files=Array.from(input.files||[]); if(!files.length) return;
    let ok=0;
    for(const file of files){
      if(file.size>5*1024*1024) continue;
      try{
        const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
        const path=`${state.user.id}/story-${Date.now()}-${Math.random().toString(36).slice(2,7)}.${ext}`;
        const {error}=await sb.storage.from('stories').upload(path,file,{cacheControl:'86400',upsert:true,contentType:file.type});
        if(error) throw error;
        const {data}=sb.storage.from('stories').getPublicUrl(path);
        await sb.from('stories').insert({user_id:state.user.id,media_url:data.publicUrl,media_type:'photo'});
        ok++;
      }catch(e){ console.warn(e); }
    }
    toast(ok? ok+' cerita dibagikan!' : 'Gagal membagikan cerita');
    const host=document.getElementById('pageHost'); if(host) renderFeed(host);
  };
  input.click();
}

function viewStory(first){
  let queue=[]; let idx=0; let timer=null; const liked=new Set(); let paused=false;
  const overlay=el('div',{className:'story-viewer'});
  function sendReply(text){
    const st=queue[idx]; if(!st||!text.trim()) return;
    sb.from('messages').insert({sender_id:state.user.id,receiver_id:st.user_id,content:text.trim()})
      .then(()=>toast('Terkirim')).catch(()=>{});
  }
  async function toggleLike(st,btn){
    if(!st||state.user.id===st.user_id) return;
    const has=liked.has(st.id);
    try{
      if(has){ await sb.from('story_likes').delete().eq('story_id',st.id).eq('user_id',state.user.id); liked.delete(st.id); }
      else{ await sb.from('story_likes').insert({story_id:st.id,user_id:state.user.id}); liked.add(st.id); }
      const h=overlay.querySelector('.story-heart'); if(h) h.classList.toggle('on',liked.has(st.id));
    }catch(e){}
  }
  function bars(){ return queue.map((_,i)=>'<span class="bar'+(i<idx?' seen':'')+(i===idx?' active':'')+(i===idx&&paused?' hold':'')+'"><i></i></span>').join(''); }
  function startTimer(){ clearTimeout(timer); if(!paused) timer=setTimeout(next,6000); }
  function pause(){ paused=true; clearTimeout(timer); overlay.querySelectorAll('.story-progress .bar.active i').forEach(b=>{ b.style.animationPlayState='paused'; }); }
  function resume(){ paused=false; overlay.querySelectorAll('.story-progress .bar.active i').forEach(b=>{ b.style.animationPlayState='running'; }); startTimer(); }
  function render(){
    const st=queue[idx]; if(!st){ close(); return; }
    const u=st.profile||{}; const isMe=u.id===state.user.id;
    overlay.innerHTML=
      '<div class="story-progress">'+bars()+'</div>'+
      '<div class="story-top"><img class="avatar" src="'+(u.avatar_url||'')+'" onerror="this.style.visibility=\'hidden\'"/>'+
      '<div><div class="nm">'+(u.full_name||u.username||'')+'</div><div class="tm">'+timeAgo(st.created_at)+'</div></div>'+
      '<button class="close" aria-label="Tutup">&times;</button></div>'+
      '<div class="story-body" id="storyBody"><img src="'+st.media_url+'" alt=""/>'+
      (st.caption?'<div class="cap">'+st.caption+'</div>':'')+
      '<div class="story-nav"><button id="prev"></button><button id="next"></button></div></div>'+
      (isMe?'':'<div class="story-reply-bar"><button class="story-heart" aria-label="Suka">'+icon('heart',32)+'</button>'+
      '<input id="replyInput" type="text" placeholder="Balas cerita..."/><button id="replyBtn">Kirim</button></div>');
    overlay.querySelector('.close').onclick=close;
    overlay.querySelector('#next').onclick=next;
    overlay.querySelector('#prev').onclick=prev;
    const rin=overlay.querySelector('#replyInput');
    if(rin){
      // Pause saat fokus mengetik, lanjut saat blur
      rin.addEventListener('focus',pause);
      rin.addEventListener('blur',resume);
      rin.onkeydown=e=>{ if(e.key==='Enter'){ sendReply(rin.value); rin.value=''; rin.blur(); next(); } };
      overlay.querySelector('#replyBtn').onclick=()=>{ sendReply(rin.value); rin.value=''; rin.blur(); };
      const hb=overlay.querySelector('.story-heart'); hb.onclick=()=>{ toggleLike(st,hb); };
      hb.classList.toggle('on',liked.has(st.id));
    }
    // Tekan lama (long press) pada area foto untuk pause, lepas untuk lanjut
    const body=overlay.querySelector('#storyBody');
    let pressTimer=null;
    body.addEventListener('touchstart',e=>{ if(e.target.tagName!=='BUTTON'){ pressTimer=setTimeout(pause,200); } },{passive:true});
    body.addEventListener('touchend',()=>{ clearTimeout(pressTimer); if(paused) resume(); });
    body.addEventListener('touchmove',()=>{ clearTimeout(pressTimer); if(paused) resume(); });
    body.addEventListener('mousedown',e=>{ if(e.target.tagName!=='BUTTON'){ pause(); } });
    body.addEventListener('mouseup',()=>{ if(paused) resume(); });
    body.addEventListener('mouseleave',()=>{ if(paused) resume(); });
    // Klik area nav kiri/kanan untuk prev/next (tanpa mem-pause)
    overlay.querySelector('#next').addEventListener('click',e=>{ e.stopPropagation(); next(); });
    overlay.querySelector('#prev').addEventListener('click',e=>{ e.stopPropagation(); prev(); });
    const seen=JSON.parse(localStorage.getItem('db_stories_seen')||'{}'); seen[st.id]=1;
    localStorage.setItem('db_stories_seen',JSON.stringify(seen));
    startTimer();
  }
  function next(){ if(paused) return; idx++; if(idx>=queue.length) close(); else render(); }
  function prev(){ if(idx>0){ idx--; render(); } }
  function close(){ clearTimeout(timer); overlay.remove(); }
  (async()=>{
    try{
      const {data}=await sb.from('stories')
        .select('*, profile:profiles!stories_user_id_fkey(id,username,full_name,avatar_url)')
        .eq('user_id',first.user_id).gt('expires_at','now()').order('created_at');
      queue=data||[];
      const at=queue.findIndex(q=>q.id===first.id); idx=at>=0?at:0;
      render();
      const {data:lk}=await sb.from('story_likes').select('story_id').eq('user_id',state.user.id).in('story_id',queue.map(q=>q.id));
      (lk||[]).forEach(x=>liked.add(x.story_id));
      const hb=overlay.querySelector('.story-heart'); if(hb) hb.classList.toggle('on',liked.has(queue[idx].id));
    }catch(e){ close(); }
  })();
  document.body.append(overlay);
}

// Kartu "Saran untuk diikuti" yang disisipkan di feed
function buildFollowSuggestion(){
  const wrap=el('div',{className:'card follow-suggest'});
  wrap.innerHTML=`<div class="fs-head"><span class="fs-title">Saran untuk diikuti</span><a class="fs-see" href="#" id="fsSee">Lihat semua</a></div>
    <div class="hlist" id="fsList"></div>`;
  (async()=>{
    const all=await listProfiles();
    const candidates=(all||[]).filter(u=>u.id!==state.user.id && !state.follows.has(u.id));
    for(let j=candidates.length-1;j>0;j--){ const k=Math.floor(Math.random()*(j+1)); [candidates[j],candidates[k]]=[candidates[k],candidates[j]]; }
    const fl=wrap.querySelector('#fsList');
    if(candidates.length===0){ fl.innerHTML='<div class="fs-empty">Kamu sudah mengikuti semua orang 🎉</div>'; return; }
    candidates.forEach(u=>{
      const fbtn=el('button',{className:'mini-follow',onClick(e){e.stopPropagation();toggleFollow(u.id,fbtn);}},'Ikuti');

async function postCard(mp){
  const p = mp.profile || await getProfile(mp.user_id);
  const card=el('div',{className:'card'});
  const head=el('div',{className:'post-head'},
    avatarFor(p),
    el('div',{className:'meta'},
      el('div',{className:'name'}, p.full_name||p.username),
      el('div',{className:'username-line'}, '@'+p.username)
    ),
    el('span',{className:'day-ribbon'},DAY_IDN[mp.day]+' • '+MEAL_IDN[mp.meal_time])
  );
  card.append(head);
  card.append(el('div',{className:'post-title'}, mp.title));
  if(mp.description) card.append(el('p',{className:'post-desc'}, mp.description));
  // Media: foto / video link (YouTube di-stream dari sumbernya, ringan)
  if(mp.media_url) card.append(mediaBlock(mp));

  // Likes & comments count
  const [{count:likes},{count:comments}] = await Promise.all([
    sb.from('likes').select('*',{count:'exact',head:true}).eq('meal_plan_id',mp.id),
    sb.from('comments').select('*',{count:'exact',head:true}).eq('meal_plan_id',mp.id)
  ]);
  const liked = (await sb.from('likes').select('id').eq('meal_plan_id',mp.id).eq('user_id',state.user.id).maybeSingle()).data;

  const actions=el('div',{className:'post-actions'},
    el('button',{className:'act'+(liked?' liked':''),onClick:()=>toggleLike(mp.id,likeBtn,countEl)},
      el('span',{className:'ic',innerHTML:icon('heart')}), el('span',{},'Suka')),
    el('button',{className:'act',onClick:()=>toggleComments(mp.id,comBox)},
      el('span',{className:'ic',innerHTML:icon('comment')}), el('span',{},'Komentar')),
    el('button',{className:'act',onClick:()=>shareWA(mp,p)},
      el('span',{className:'ic',innerHTML:icon('share')}), el('span',{},'Bagikan')),
    el('button',{className:'act',onClick:()=>openRecipeModal(mp)},
      el('span',{className:'ic',innerHTML:icon('bookmark')}), el('span',{},'Resep'))
  );
  const likeBtn=actions.children[0];
  const countEl=el('span',{className:'muted'}, likes>0?` (${likes})`:'');
  likeBtn.append(countEl);
  card.append(actions);

  const comBox=el('div',{className:'comments hidden'});
  card.append(comBox);
  card.dataset.commentsLoaded='0';
  // Auto-buka komentar bila datang dari notifikasi
  if(state.openCommentsFor && state.openCommentsFor===mp.id){
    setTimeout(()=>{
      toggleComments(mp.id,comBox);
      card.scrollIntoView({behavior:'smooth',block:'center'});
      state.openCommentsFor=null;
    },300);
  }
  return card;
}

async function toggleLike(mealId,btn,countEl){
  const existing=(await sb.from('likes').select('id').eq('meal_plan_id',mealId).eq('user_id',state.user.id).maybeSingle()).data;
  const ic=btn.querySelector('.ic');
  if(existing){
    await sb.from('likes').delete().eq('id',existing.id);
    btn.classList.remove('liked'); if(ic) ic.innerHTML=icon('heart');
  }else{
    await sb.from('likes').insert({meal_plan_id:mealId,user_id:state.user.id});
    btn.classList.add('liked'); if(ic) ic.innerHTML=icon('heart');
  }
  const {count}=await sb.from('likes').select('*',{count:'exact',head:true}).eq('meal_plan_id',mealId);
  countEl.textContent=count>0?` ${count}`:'';
}

async function toggleComments(mealId,box){
  if(!box.classList.contains('hidden')){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  if(box.dataset.commentsLoaded==='1') return;
  box.innerHTML='Memuat...';
  const {data}=await sb.from('comments').select('*, profile:profiles(*)').eq('meal_plan_id',mealId).order('created_at');
  box.innerHTML='';
  (data||[]).forEach(c=>{
    const u=c.profile;
    box.append(el('div',{className:'comment'},
      avatarFor(u),
      el('div',{className:'bubble'},
        el('div',{className:'c-name'},u.full_name||u.username),
        el('div',{className:'c-text'},c.content),
        el('div',{className:'c-when'},timeAgo(c.created_at))
      )
    ));
  });
  if((data||[]).length===0) box.append(el('div',{className:'c-when',style:'margin-bottom:6px'},'Jadi yang pertama berkomentar'));
  const input=el('div',{className:'comment-input'},
    el('input',{type:'text',placeholder:'Tulis komentar...'}),
    el('button',{innerHTML:icon('send')})
  );
  input.querySelector('button').onclick=async()=>{
    const v=input.querySelector('input').value.trim(); if(!v)return;
    await sb.from('comments').insert({meal_plan_id:mealId,user_id:state.user.id,content:v});
    box.dataset.commentsLoaded='0'; toggleComments(mealId,box);
  };
  input.querySelector('input').addEventListener('keydown',e=>{if(e.key==='Enter')input.querySelector('button').click();});
  box.append(input);
  box.dataset.commentsLoaded='1';
}

async function renderExplore(host){
  host.innerHTML='';

  const all=await listProfiles();
  const others=(all||[]).filter(u=>u.id!==state.user.id);
  const suggestions=others.filter(u=>!state.follows.has(u.id));
  const following=others.filter(u=>state.follows.has(u.id));
  function card(u){
    const fbtn=el('button',{className:'mini-follow'+(state.follows.has(u.id)?' following':''),onClick(e){e.stopPropagation();toggleFollow(u.id,fbtn);}},state.follows.has(u.id)?'Mengikuti':'Ikuti');
    return el('div',{className:'card',style:'text-align:center;margin:0;cursor:pointer',onClick:()=>go('userProfile',{userId:u.id})},
      (()=>{const a=avatarFor(u);a.style.margin='0 auto 8px';a.style.width='56px';a.style.height='56px';a.style.fontSize='20px';return a;})(),
      el('div',{style:'font-weight:600'},u.full_name||u.username),
      el('div',{style:'font-size:12px;color:var(--muted)'},'@'+u.username),
      fbtn
    );
  }
  // Saran untuk diikuti
  page.append(el('div',{className:'section-title'},'Saran untuk diikuti'));
  if(suggestions.length===0){
    page.append(el('div',{className:'empty',style:'padding:18px'},'Kamu sudah mengikuti semua orang 🎉'));
  }else{
    const h=el('div',{className:'hlist'});

  }
  // Yang diikuti
  if(following.length){

    const g=el('div',{style:'display:grid;grid-template-columns:1fr 1fr;gap:10px'});
    following.forEach(u=>g.append(card(u)));
    page.append(g);
  }
}

function editMealModal(mp,day,mealTime){
  const isEdit=!!mp;
  const titleInput=el('input',{value:mp?.title||'',placeholder:'Contoh: Telur Balado'});
  const descInput=el('textarea',{rows:2,placeholder:'Deskripsi singkat (opsional)'}); descInput.value=mp?.description||'';
  const mediaInput=el('input',{type:'url',inputmode:'url',placeholder:'https://youtu.be/... (video) atau biarkan kosong',value:(mp?.media_type==='youtube'||mp?.media_type==='video_link')?mp?.media_url:''});
  const photoInput=el('input',{type:'file',accept:'image/*',style:'display:none'});
  const mediaPreview=el('div',{className:'media-preview'});
  const uploadBtn=el('button',{type:'button',className:'btn ghost media-upload-btn',onClick:()=>photoInput.click()},'Pilih Foto');
  const clearMediaBtn=el('button',{type:'button',className:'link-btn media-clear',style:'display:none',onClick:()=>{ selectedMedia=null; mediaInput.value=''; mediaPreview.innerHTML=''; clearMediaBtn.style.display='none'; }},'Hapus foto');
  const mediaHint=el('div',{className:'field-hint'},'Unggah foto masakan, atau tempel link YouTube untuk video. Opsional.');
  let selectedMedia = (mp?.media_type==='photo')? mp.media_url : null;
  function renderPreview(){
    if(!selectedMedia){ mediaPreview.innerHTML=''; return; }
    mediaPreview.innerHTML=`<img src="${selectedMedia}" alt="preview"/>`;
  }
  renderPreview();
  photoInput.addEventListener('change', async ()=>{
    const file=photoInput.files && photoInput.files[0]; if(!file) return;
    if(file.size>5*1024*1024){ toast('Ukuran foto maksimal 5MB'); return; }
    upStatus.textContent='Mengunggah...';
    try{
      const ext=(file.name.split('.').pop()||'jpg').toLowerCase();
      const path=`${state.user.id}/menu-${Date.now()}.${ext}`;
      const {error}=await sb.storage.from('meal-photos').upload(path,file,{cacheControl:'3600',upsert:true,contentType:file.type});
      if(error) throw error;
      const {data}=sb.storage.from('meal-photos').getPublicUrl(path);
      selectedMedia=data.publicUrl;
      mediaInput.value=''; // foto pakai selectedMedia, link pakai mediaInput
      renderPreview();
      clearMediaBtn.style.display='inline-block';
      upStatus.textContent='Foto siap disimpan';
    }catch(e){ upStatus.textContent='Gagal unggah: '+(e.message||e); }
  });
  const upStatus=el('div',{className:'field-hint media-status'});
  const recipeInput=el('textarea',{rows:5,placeholder:'Tulis resep andalan di sini...'}); recipeInput.value=mp?.recipe||'';
  const mealSel=el('select',{}, ...['breakfast','lunch','dinner'].map(m=>el('option',{value:m,...(m===(mp?.meal_time||mealTime)?{selected:true}:{})},MEAL_IDN[m])));
  const daySel=el('select',{}, ...DAY_ID.map(d=>el('option',{value:d,...(d===(mp?.day||day)?{selected:true}:{})},DAY_IDN[d])));
  openModal(el('div',{className:'modal-wrap'},
    el('button',{className:'close-x',onClick:closeModal,innerHTML:icon('close',20)}),
    el('h3',{},isEdit?'Ubah Menu':'Tambah Menu'),
    el('div',{className:'field'},el('label',{},'Hari'),daySel),
    el('div',{className:'field'},el('label',{},'Waktu Makan'),mealSel),
    el('div',{className:'field'},el('label',{},'Nama Menu'),titleInput),
    el('div',{className:'field'},el('label',{},'Deskripsi'),descInput),
    el('div',{className:'field'},el('label',{},'Foto / Video'),uploadBtn,clearMediaBtn,mediaPreview,upStatus,el('label',{style:'margin-top:8px'},'Atau tempel link YouTube'),mediaInput,mediaHint),
    el('div',{className:'field'},el('label',{},'Resep (untuk dibagikan)'),recipeInput),
    el('button',{className:'btn',onClick:async()=>{
      const title=titleInput.value.trim(); if(!title){toast('Nama menu wajib diisi');return;}
      const linkUrl=mediaInput.value.trim();
      const mUrl = selectedMedia || linkUrl || null;
      let mType = selectedMedia ? 'photo' : mediaType(linkUrl);
      const payload={day:daySel.value,meal_time:mealSel.value,title,description:descInput.value.trim(),media_url:mUrl,media_type:mType,recipe:recipeInput.value.trim()};
      if(isEdit){ await sb.from('meal_plans').update(payload).eq('id',mp.id); toast('Menu diperbarui'); }
      else{ payload.user_id=state.user.id; payload.is_weekly=true; await sb.from('meal_plans').insert(payload); toast('Menu ditambahkan'); }
      closeModal(); renderPlanner($('#pageHost'));
    }}, isEdit?'Simpan Perubahan':'Tambah Menu')
  ));
}

/* =====================================================================
   NOTIFICATIONS
   ===================================================================== */
const NOTIF_ICON={like:'',comment:'',message:'',follow:''};
const NOTIF_LABEL={like:'menyukai',comment:'mengomentari',message:'mengirim pesan',follow:'mulai mengikuti'};
async function renderNotifications(host){
  const page=el('div',{className:'page'}); host.append(page);
  page.append(el('div',{className:'row-between'},
    el('div',{className:'section-title',style:'margin:10px 4px'},'Notifikasi'),
    el('button',{className:'link-btn',onClick:markAllRead},'Tandai dibaca')
  ));
  const list=el('div',{id:'notifList'}); page.append(list);
  list.append(el('div',{className:'empty'},'Memuat...'));
  const {data}=await sb.from('notifications').select(
    '*, actor:profiles!notifications_actor_id_fkey(id,username,full_name,avatar_url), meal:meal_plans(id,title,day,meal_time)'
  ).eq('user_id',state.user.id).order('created_at',{ascending:false}).limit(50);
  list.innerHTML='';
  if(!data||data.length===0){ list.append(el('div',{className:'empty'},el('div',{className:'eicon',innerHTML:icon('bell',40)}),'Belum ada notifikasi. Mulai dengan menyukai atau berkomentar!')); return; }
  for(const n of data){
    const a=n.actor;
    const name = a?.full_name || a?.username || 'Seseorang';
    const meal = n.meal;
    let detail;
    if(n.type==='like') detail = name+' menyukai menu'+(meal?' "'+meal.title+'"':'')+' ❤️';
    else if(n.type==='comment') detail = name+' berkomentar di "'+(meal?title:'')+'": '+((n.content||'').replace(/^berkomentar:\s*/i,''));
    else if(n.type==='message') detail = name+': '+(n.content||'mengirim pesan');
    else detail = name+' '+(n.content||NOTIF_LABEL[n.type]);

    const isMsg = n.type==='message';
    const item=el('div',{className:'convo-item notif-item'+(n.is_read?' read':''),
      onClick:()=>openNotif(n)},
      avatarFor(a||{username:'?'}),
      el('div',{className:'info'},
        el('div',{className:'nm'},
          (
            n.type==='like'?'Suka':
            n.type==='comment'?'Komentar baru':
            n.type==='message'?'Pesan baru':'Notifikasi'
          ),
          meal && !isMsg ? el('span',{className:'notif-meal-tag'},meal.title) : null
        ),
        el('div',{className:'pv'}, detail),
        el('div',{className:'notif-actions'},
          isMsg
            ? el('button',{className:'notif-reply',onClick:e=>{e.stopPropagation();openNotif(n)}},'Balas pesan')
            : el('button',{className:'notif-reply',onClick:e=>{e.stopPropagation();replyNotif(n)}},'Balas komentar')
        )
      ),
      el('div',{className:'tm'},timeAgo(n.created_at)),
      n.is_read?null:el('span',{className:'unread-dot'})
    );
    list.append(item);
  }
  // JANGAN otomatis tandai semua terbaca — biar user yang klik/balas.
  // (badge diperbarui saat aksi atau lewat polling.)
}
async function markAllRead(){ await sb.from('notifications').update({is_read:true}).eq('user_id',state.user.id); state.unreadNotif=0; updateNotifBadge(); go('notifications'); }
function openNotif(n){
  // tandai notifikasi ini terbaca
  if(!n.is_read){
    sb.from('notifications').update({is_read:true}).eq('id',n.id).then(()=>{
      state.unreadNotif=Math.max(0,state.unreadNotif-1); updateNotifBadge();
    });
  }
  if(n.type==='message' && n.actor_id){ state.chatWith=n.actor_id; go('messages',{chatWith:n.actor_id}); }
  else if(n.meal_plan_id){
    if(n.meal?.day){ state.feedFilter=n.meal.day; }
    state.openCommentsFor=n.meal_plan_id;
    go('feed');
  }
  else go('feed');
}
// Balas komentar: buka feed + auto-expand komentar menu terkait
function replyNotif(n){
  if(n.type==='message'){ openNotif(n); return; }
  if(n.meal?.day) state.feedFilter=n.meal.day;
  state.openCommentsFor=n.meal_plan_id;
  go('feed');
}
function updateNotifBadge(){
  const btns=document.querySelectorAll('.topbar .icon-btn');
  const bell=btns[0]; if(!bell)return;
  bell.querySelectorAll('.badge-dot').forEach(d=>d.remove());
  if(state.unreadNotif>0) bell.append(el('span',{className:'badge-dot'}));
}
async function refreshUnreadCounts(){
  if(!state.user)return;
  const [{count:m},{count:n}]=await Promise.all([
    sb.from('messages').select('id',{count:'exact',head:true}).eq('receiver_id',state.user.id).eq('is_read',false),
    sb.from('notifications').select('id',{count:'exact',head:true}).eq('user_id',state.user.id).eq('is_read',false)
  ]);
  state.unreadCount=m||0; state.unreadNotif=n||0;
  updateUnreadBadge(); updateNotifBadge();
}

/* =====================================================================
   MESSAGES (DM list + chat)
   ===================================================================== */
async function renderConversations(host){
  const page=el('div',{className:'page'}); host.append(page);
  page.append(el('div',{className:'section-title'},'Pesan'));
  const me=state.user.id;
  // Ambil SEMUA pesan yang terkirim/diterima user ini
  const {data:msgs,error}=await sb.from('messages').select('*')
    .or(`sender_id.eq.${me},receiver_id.eq.${me}`)
    .order('created_at',{ascending:false});
  if(error){ page.append(el('div',{className:'empty'},'Gagal memuat: '+error.message)); return; }
  // group by other user, keep latest
  const convos={};
  (msgs||[]).forEach(m=>{
    const other=m.sender_id===state.user.id?m.receiver_id:m.sender_id;
    if(!convos[other]) convos[other]={last:m,unread:0};
    if(m.receiver_id===state.user.id && !m.is_read) convos[other].unread++;
  });
  const others=Object.keys(convos);
  if(others.length===0){
    page.append(el('div',{className:'empty'},el('div',{className:'eicon',innerHTML:icon('inbox',40)}),'Belum ada pesan. Mulai dari halaman Jelajah untuk berbagi resep!'));
    return;
  }
  for(const uid of others){
    const u=await getProfile(uid); const c=convos[uid];
    const item=el('button',{className:'convo-item',style:'width:100%;text-align:left',onClick:()=>go('messages',{chatWith:uid})},
      avatarFor(u),
      el('div',{className:'info'},el('div',{className:'nm'},u.full_name||u.username),
        el('div',{className:'pv'},(c.last.sender_id===state.user.id?'Kamu: ':'')+(c.last.recipe?'Membagikan resep':c.last.content))),
      el('div',{className:'tm'},timeAgo(c.last.created_at)),
      c.unread>0?el('span',{className:'unread-dot'}):null
    );
    page.append(item);
  }
}

async function renderChat(host){
  const other=await getProfile(state.chatWith); if(!other){state.chatWith=null;go('messages');return;}
  const page=el('div',{className:'page chat-view'}); host.append(page);
  const head=el('div',{className:'chat-head'},
    el('button',{className:'back-btn',onClick:()=>{state.chatWith=null;go('messages')},innerHTML:icon('back',24)}),
    avatarFor(other),
    el('div',{},el('div',{className:'nm'},other.full_name||other.username),el('div',{className:'c-when'},'@'+other.username)),
    el('div',{style:'flex:1'}),
    el('button',{className:'share-recipe-btn',onClick:()=>pickRecipeToShare(other)},'Resep')
  );
  page.append(head);
  // area pesan: tetap ada padding kiri-kanan agar tidak mepet
  const box=el('div',{className:'chat-messages',id:'chatBox'}); page.append(box);
  const input=el('div',{className:'chat-input'},
    el('input',{id:'chatInput',placeholder:'Tulis pesan...'}),
    el('button',{onClick:sendChat,innerHTML:icon('send')})
  );
  $('#app').append(input); // fixed bottom
  $('#chatInput').addEventListener('keydown',e=>{if(e.key==='Enter')sendChat();});
  loadChat(box,other.id);
}
async function loadChat(box,otherId){
  const {data}=await sb.from('messages').select('*')
    .or(`and(sender_id.eq.${state.user.id},receiver_id.eq.${otherId}),and(sender_id.eq.${otherId},receiver_id.eq.${state.user.id})`)
    .order('created_at');
  box.innerHTML='';
  (data||[]).forEach(m=>box.append(bubble(m)));
  // mark incoming as read
  await sb.from('messages').update({is_read:true}).eq('sender_id',otherId).eq('receiver_id',state.user.id).eq('is_read',false);
  state.unreadCount=0; updateUnreadBadge();
  box.scrollTop=box.scrollHeight;
  setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),50);
}
function bubble(m){
  const mine=m.sender_id===state.user.id;
  const time=new Date(m.created_at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
  const inner=[];
  if(m.recipe){
    inner.push(el('div',{className:'recipe-card'},el('b',{},'Resep Dibagikan'),el('div',{style:'white-space:pre-wrap;margin-top:4px'},m.recipe)));
  }
  if(m.content) inner.push(document.createTextNode(m.content));
  inner.push(el('div',{className:'ct'},time));
  return el('div',{className:'bubble-msg '+(mine?'me':'them')},...inner);
}
async function sendChat(){
  const inp=$('#chatInput'); const v=inp.value.trim(); if(!v||!state.chatWith)return;
  inp.value='';
  await sb.from('messages').insert({sender_id:state.user.id,receiver_id:state.chatWith,content:v});
  loadChat($('#chatBox'),state.chatWith);
}
function pickRecipeToShare(other){
  openModal(el('div',{className:'modal-wrap'},
    el('button',{className:'close-x',onClick:closeModal,innerHTML:icon('close',20)}),
    el('h3',{},'Bagikan Resep ke '+other.full_name),
    (async()=>{
      const {data}=await sb.from('meal_plans').select('*').eq('user_id',state.user.id).not('recipe','is',null);
      const wrap=el('div',{});
      if((data||[]).length===0) wrap.append(el('div',{className:'empty'},'Kamu belum menulis resep di menu manapun.'));
      (data||[]).forEach(mp=>{
        wrap.append(el('button',{className:'meal-row',style:'width:100%;text-align:left;margin-bottom:8px',onClick:async()=>{
          await sb.from('messages').insert({sender_id:state.user.id,receiver_id:other.id,content:'Coba resep andalanku: '+mp.title,recipe:mp.recipe});
          closeModal(); loadChat($('#chatBox'),other.id); toast('Resep dibagikan!');
        }},
          el('div',{className:'emoji',innerHTML:icon('bookmark',20)}),
          el('div',{className:'info'},el('div',{className:'t'},mp.title),el('div',{className:'d'},DAY_IDN[mp.day]+' • '+MEAL_IDN[mp.meal_time]))
        ));
      });
      return wrap;
    })()
  ));
}
// Helper called from recipe modal after navigating
function startShareRecipe(mp){
  if(!state.chatWith) return;
  sb.from('messages').insert({sender_id:state.user.id,receiver_id:state.chatWith,content:'Coba resep: '+mp.title,recipe:mp.recipe}).then(()=>loadChat($('#chatBox'),state.chatWith));
}

/* =====================================================================
   REALTIME subscriptions (likes, comments, messages, meal plans)
   ===================================================================== */
function subscribeRealtime(){
  sb.channel('public-changes')
    .on('postgres_changes',{event:'*',schema:'public',table:'comments'},()=>{ /* komentar dimuat saat dibuka */ })
    .on('postgres_changes',{event:'*',schema:'public',table:'messages'},payload=>{
      if(state.view==='messages' && state.chatWith && state.chatWith===(payload.new?.sender_id)){ loadChat($('#chatBox'),state.chatWith); }
      else { state.unreadCount++; updateUnreadBadge(); toast('Pesan baru masuk'); }
    })
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'notifications'},payload=>{
      if(payload.new && payload.new.user_id===state.user.id && !payload.new.is_read){
        state.unreadNotif++; updateNotifBadge();
      }
    })
    .on('postgres_changes',{event:'*',schema:'public',table:'meal_plans'},()=>{ if(state.view==='feed'||state.view==='planner'){const host=$('#pageHost');if(host&&state.view==='feed')renderFeed(host);} })
    .subscribe();
}
function updateUnreadBadge(){
  // tombol pesan adalah icon-btn kedua (bell notifikasi pertama)
  const btns=document.querySelectorAll('.topbar .icon-btn');
  const btn=btns[1]; if(!btn)return;
  sb.from('messages').select('id',{count:'exact',head:true}).eq('receiver_id',state.user.id).eq('is_read',false)
    .then(({count})=>{
      state.unreadCount=count||0;
      btn.querySelectorAll('.badge-dot').forEach(d=>d.remove());
      if(state.unreadCount>0) btn.append(el('span',{className:'badge-dot'}));
    });
}

/* =====================================================================
   MODAL helpers
   ===================================================================== */
function openModal(content){
  const root=$('#modalRoot');
  const bg=el('div',{className:'modal-bg',onClick:e=>{if(e.target===bg)closeModal();}});
  const modal=el('div',{className:'modal'},content);
  bg.append(modal); root.append(bg);
}
function closeModal(){ $('#modalRoot').innerHTML=''; }

/* =====================================================================
   INIT
   ===================================================================== */
loadSession();
// polling ringan untuk hitung unread setiap 30 detik (fallback realtime)
setInterval(()=>{ if(state.user) refreshUnreadCounts(); },30000);

// Tangkap event install PWA (Chrome/Android/Edge)
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault();
  state.installPrompt=e;
  // Jika sedang di feed, tampilkan banner
  if(state.view==='feed' && !isStandalone()){
    const host=document.getElementById('pageHost');
    if(host && !document.querySelector('.install-banner')){
      // render ulang feed agar banner muncul
      renderFeed(host);
    }
  }
});
window.addEventListener('appinstalled',()=>{
  state.installPrompt=null;
  localStorage.removeItem('Restbook_noinstall');
  document.querySelector('.install-banner')?.remove();
});

/* ===== Daftarkan Service Worker agar bisa di-install PWA ===== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(reg => {
      // Cek update otomatis
      reg.update();
      setInterval(()=>reg.update(), 60*60*1000);
      // Kalau SW baru terpasang, paksa reload
      function listenWaiting(worker){
        if(!worker) return;
        worker.addEventListener('statechange', () => {
          if(worker.state === 'activated'){ window.location.reload(); }
        });
        worker.postMessage('SKIP_WAITING');
      }
      listenWaiting(reg.installing || reg.waiting);
      reg.addEventListener('updatefound', ()=>listenWaiting(reg.installing));
      navigator.serviceWorker.addEventListener('controllerchange', ()=>window.location.reload());
    }).catch((err) => {
      console.warn('SW gagal didaftarkan:', err);
    });
  });
}
</script>
